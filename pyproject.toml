[project]
name = "bthome-writable-tools"
version = "0.0.0"
description = "Tooling and tests for the bthome-writable project"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["ha", "tools"]
extend-exclude = [".venv", ".venv-ha", "node_modules"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tools"]
known-third-party = ["homeassistant"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
# `tools` is a plain directory, not a package, so pytest puts `tools/` on
# sys.path rather than the repo root -- and a bare `pytest` (unlike
# `python -m pytest`) does not add the working directory either. Without this,
# `from tools import ...` fails on any machine that invokes pytest directly,
# which is exactly what CI does.
pythonpath = ["."]
