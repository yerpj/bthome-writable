<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    --ink: #1a1d21;
    --muted: #5b6570;
    --line: #d5dbe1;
    --dev: #0b6e4f;
    --ha: #0b5394;
    --warm: #b3261e;
    --wash: #f6f8fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #fff; color: var(--ink);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    width: 540px; padding: 26px 28px 20px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 16px; }
  .sub b { color: var(--ink); font-weight: 600; }

  .setup { background: var(--wash); border: 1px solid var(--line);
           border-radius: 10px; padding: 8px 14px 8px; }
  .need { margin: 4px 0 0; padding: 0; list-style: none;
          display: flex; gap: 13px; flex-wrap: wrap; font-size: 11.5px;
          color: var(--muted); }
  .need li { position: relative; padding-left: 12px; }
  .need li::before { content: ""; position: absolute; left: 0; top: 6px;
                     width: 6px; height: 6px; border-radius: 50%; background: var(--dev); }
  .need li.ha::before { background: var(--ha); }
  .need li.time::before { background: var(--muted); }
  .need b { color: var(--ink); font-weight: 600; }
</style>

<h1>Try it in ten minutes</h1>
<p class="sub">Home Assistant switches the LED; the Puck's <b>own light sensor</b> reports the result back. The loop closes on a measurement, not an echo.</p>

<div class="setup">
  <svg width="484" height="116" viewBox="0 0 484 116">
    <line x1="30" y1="98" x2="340" y2="98" stroke="#c7cfd6" stroke-width="2"/>

    <circle cx="96" cy="84" r="19" fill="#0b6e4f" opacity=".13"/>
    <circle cx="96" cy="84" r="11" fill="#fff" stroke="#0b6e4f" stroke-width="2"/>
    <circle cx="96" cy="84" r="4" fill="#0b6e4f"/>

    <path d="M58 98 L58 40 Q58 31 69 31 L123 31 Q134 31 134 40 L134 98 Z"
          fill="#e8eef3" fill-opacity=".82" stroke="#9fb0bf" stroke-width="2"/>
    <path d="M134 48 q22 0 22 18 t-22 18" fill="none" stroke="#9fb0bf" stroke-width="2"/>
    <text x="96" y="24" text-anchor="middle" font-size="10.5" fill="#5b6570"
          font-family="-apple-system, Segoe UI, Roboto, sans-serif">an opaque mug</text>
    <text x="96" y="113" text-anchor="middle" font-size="11" fill="#0b6e4f"
          font-weight="700" font-family="-apple-system, Segoe UI, Roboto, sans-serif">Puck.js</text>

    <g stroke="#0b5394" fill="none" stroke-width="2" opacity=".45">
      <path d="M196 74 q10 -11 0 -22"/>
      <path d="M206 81 q17 -18 0 -36"/>
    </g>

    <rect x="248" y="46" width="56" height="44" rx="8" fill="#fff"
          stroke="#0b5394" stroke-width="2"/>
    <path d="M262 70 l14 -12 14 12" fill="none" stroke="#0b5394" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="269" y="70" width="13" height="11" fill="#0b5394" opacity=".22"/>
    <text x="276" y="113" text-anchor="middle" font-size="11" fill="#0b5394"
          font-weight="700" font-family="-apple-system, Segoe UI, Roboto, sans-serif">Home Assistant</text>
  </svg>
  <ul class="need">
    <li><b>a Puck.js</b></li>
    <li><b>something opaque</b> to cover it</li>
    <li class="ha"><b>Home Assistant</b> with Bluetooth</li>
  </ul>
</div>
