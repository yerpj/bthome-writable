name: CI

on:
  push:
    branches: [main]
  pull_request:

# Two Python jobs, not one, and deliberately so: the newest bthome-ble needs a
# habluetooth and cryptography that the Home Assistant release our test harness
# pins holds back. Rather than pick one and let the other rot, each side runs
# against the versions it actually ships with.
jobs:
  tools:
    name: Spec tooling (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Pytest
        run: pytest -q

  homeassistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ha/requirements-test.txt bthome-ble bleak-retry-connector
      - name: Pytest
        working-directory: ha
        run: pytest -q

  javascript:
    name: Espruino module (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: espruino
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
