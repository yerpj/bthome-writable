name: CI

on:
  push:
    branches: [main]
  pull_request:

# Two Python jobs, not one, and deliberately so: the newest bthome-ble needs a
# habluetooth and cryptography that the Home Assistant release our test harness
# pins holds back. Rather than pick one and let the other rot, each side runs
# against the versions it actually ships with.
jobs:
  tools:
    name: Spec tooling (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Pytest
        run: python -m pytest -q
      # espruino/dist/ is generated but committed, so it can silently fall
      # behind the sources it is built from -- and the bundle tests read dist/,
      # so they keep passing against the stale copy. This is what noticed.
      - name: Bundles match their sources
        run: |
          python -m tools.build_espruino_bundle
          git diff --exit-code espruino/dist

  homeassistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ha/requirements-test.txt
      - name: Pytest
        working-directory: ha
        run: python -m pytest -q

  # The two checks the receiving ends run on a submission, run here instead so a
  # failure is a red tick rather than a rejected pull request. Neither needs our
  # dependencies: hassfest reads manifest.json, strings.json and the translations
  # the way Home Assistant core does, and the HACS action reads the repository
  # layout the way HACS does.
  #
  # Neither is really pinned. hassfest publishes only `master`, and the HACS
  # action's tag selects a wrapper that runs a Docker image tagged `main`. Both
  # therefore track what the receiving end currently requires -- which is the
  # point of running them, and also means either can go red without us having
  # changed anything.
  validate:
    name: Home Assistant and HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
      - name: HACS
        uses: hacs/action@22.5.0
        with:
          category: integration
          # One check is ignored, because it cannot be satisfied from inside
          # this repository:
          #
          #   brands  the domain is not registered in home-assistant/brands.
          #           That needs a pull request there -- task T4.3.
          #
          # It is release work, not a defect, and a permanently red tick
          # teaches people to stop reading ticks. **The step below is what
          # stops this being forgotten**: it fails as soon as the check could
          # pass, naming the word to delete from this line. Every other HACS
          # check stays on.
          #
          # `topics` was ignored here too until 2026-10-14, when the repository
          # got its topics -- and the step below is how we found out, within
          # the hour. It does work.
          ignore: brands

      # An ignore that nobody revisits is how a release ships without its brand
      # assets. So this asks, on every run, whether the exemption above is
      # still deserved -- and breaks the build the moment it is not.
      #
      # It never fails for being unable to answer: a rate-limited API or a
      # network blip says "not judging" and passes. The only red it produces is
      # the one worth acting on.
      - name: The ignored HACS check is still necessary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stale=0
          domain=$(jq -r .domain custom_components/*/manifest.json)

          brands="https://raw.githubusercontent.com/home-assistant/brands"
          code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
            "$brands/master/custom_integrations/$domain/icon.png" || echo "000")
          case "$code" in
            404)
              echo "brands: $domain is still not registered, so the ignore stands"
              ;;
            200)
              echo "::error::$domain is now in home-assistant/brands, so the"
              echo "::error::HACS 'brands' check would pass. Remove 'brands'"
              echo "::error::from the ignore: list in this workflow."
              stale=1
              ;;
            *)
              echo "::notice::brands answered $code; not judging"
              ;;
          esac

          exit $stale

  javascript:
    name: Espruino module (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: espruino
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
