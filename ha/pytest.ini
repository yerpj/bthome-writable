# The Home Assistant suite runs under its own config: it needs pytest-asyncio's
# auto mode, which the tools suite neither has nor wants (the two live in
# separate virtualenvs, because bthome-ble's newest release and the HA version
# the test harness pins disagree about habluetooth and cryptography).
#
#   pytest -c ha/pytest.ini ha/tests
[pytest]
asyncio_mode = auto
testpaths = tests
